<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Voxel Generation</title>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="crosshair" style="position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background-color: dimgray;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
